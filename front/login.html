<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-box">
    <img class="login-logo" src="img/logo-csspp.png" alt="Símbolo CSSPP">
    <h1 class="login-title text-center"><i class="bi bi-shield-lock-fill" aria-hidden="true"></i> Sistema de controle de vendas</h1>
    <p class="login-subtitle text-center">Clube dos Subtenentes e Sargentos do 11º RC MEC</p>
    <div class="login-hints" aria-hidden="true">
      <div><i class="bi bi-info-circle" aria-hidden="true"></i> Use apenas números no CPF.</div>
      <div><i class="bi bi-keyboard" aria-hidden="true"></i> Pressione Enter após a senha para entrar mais rápido.</div>
    </div>
    <div id="loginErro" class="alert alert-danger" style="display:none; padding:8px 10px; margin-bottom:12px;"></div>
    <form id="loginForm" method="post" action="/login" autocomplete="off">
      <div class="mb-3">
        <label class="form-label">CPF:</label>
        <div class="field">
          <i class="bi bi-person-vcard" aria-hidden="true"></i>
          <input type="text" id="cpfInput" name="cpf" class="form-control" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha:</label>
        <div class="field">
          <i class="bi bi-key" aria-hidden="true"></i>
          <input type="password" id="senhaInput" name="senha" class="form-control" required autocomplete="new-password">
        </div>
      </div>
      <div id="capsLockWarning" class="caps-lock-warning"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i> Caps Lock está ativado.</div>
      <label class="mostrar-senha" for="mostrarSenhaInput">
        <input type="checkbox" id="mostrarSenhaInput">
        Mostrar senha
      </label>
      <button id="btnEntrar" type="submit" class="btn btn-primary btn-login w-100"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar</button>
    </form>
    <div class="login-footer">© 2026 Quantum and time - Todos os direitos reservados.</div>
  </div>

  <script src="js/configuracao-ambiente.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/app-session.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const erroBox = document.getElementById('loginErro');
    const btnEntrar = document.getElementById('btnEntrar');
    const cpfInput = document.getElementById('cpfInput');
    const senhaInput = document.getElementById('senhaInput');
    const mostrarSenhaInput = document.getElementById('mostrarSenhaInput');
    const capsLockWarning = document.getElementById('capsLockWarning');

    // Limpa possíveis valores restaurados automaticamente pelo navegador.
    form.reset();
    window.TocaSession.limparChaveSessaoNavegador();
    window.TocaSession.instalarFetchComCsrf(() => '');
    cpfInput.value = '';
    senhaInput.value = '';
    cpfInput.focus();

    function formatarCpf(value) {
      const digits = String(value || '').replace(/\D/g, '').slice(0, 11);
      if (digits.length <= 3) return digits;
      if (digits.length <= 6) return `${digits.slice(0, 3)}.${digits.slice(3)}`;
      if (digits.length <= 9) return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6)}`;
      return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6, 9)}-${digits.slice(9)}`;
    }

    cpfInput.addEventListener('input', () => {
      cpfInput.value = formatarCpf(cpfInput.value);
    });

    cpfInput.addEventListener('paste', (event) => {
      event.preventDefault();
      const textoColado = (event.clipboardData || window.clipboardData).getData('text');
      cpfInput.value = formatarCpf(textoColado);
    });

    mostrarSenhaInput.addEventListener('change', () => {
      senhaInput.type = mostrarSenhaInput.checked ? 'text' : 'password';
    });

    function atualizarAvisoCapsLock(event) {
      const ativo = Boolean(event && event.getModifierState && event.getModifierState('CapsLock'));
      capsLockWarning.style.display = ativo ? 'block' : 'none';
    }

    senhaInput.addEventListener('keydown', atualizarAvisoCapsLock);
    senhaInput.addEventListener('keyup', atualizarAvisoCapsLock);
    senhaInput.addEventListener('blur', () => {
      capsLockWarning.style.display = 'none';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      erroBox.style.display = 'none';
      btnEntrar.disabled = true;
      btnEntrar.textContent = 'Entrando...';

      const formData = new FormData(form);
      const body = new URLSearchParams();
      body.set('cpf', String(formData.get('cpf') || ''));
      body.set('senha', String(formData.get('senha') || ''));

      try {
        const resposta = await fetch('/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'application/json',
            'X-Requested-With': 'fetch'
          },
          body: body.toString()
        });

        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          throw new Error(dados.error || 'Não foi possível entrar no sistema');
        }

        const browserSessionKey = String(dados.browserSessionKey || '').trim()
          || window.TocaSession.garantirChaveSessaoNavegador();
        window.TocaSession.definirChaveSessaoNavegador(browserSessionKey);
        const destino = dados.redirect || '/';
        // replace evita voltar para o login ao usar botão "voltar" após autenticar
        window.location.replace(destino);
      } catch (erro) {
        const msg = String(erro && erro.message ? erro.message : '');
        erroBox.textContent = msg || 'Servidor offline. Inicie o backend (node server.js) e tente novamente.';
        erroBox.style.display = 'block';
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = '<i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar';
      }
    });
  </script>
</body>
</html>
