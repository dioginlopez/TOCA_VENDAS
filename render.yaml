services:
  - type: web
    name: sistema-vendas-api
    runtime: node
    rootDir: back
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-vendas-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://sistema-vendas-front.onrender.com
      - key: AUTO_BACKUP_ON_START
        value: "false"
      - key: BOOTSTRAP_ADMIN_CPF
        sync: false
      - key: BOOTSTRAP_ADMIN_SENHA
        sync: false
      - key: BOOTSTRAP_ADMIN_NOME
        value: ADMIN

  - type: static_site
    name: sistema-vendas-front
    rootDir: front
    buildCommand: node -e "require('fs').writeFileSync('js/configuracao-ambiente.js', 'window.TOCA_API_URL = ' + JSON.stringify(process.env.TOCA_API_URL || 'https://sistema-vendas-api.onrender.com') + ';\\n')"
    staticPublishPath: .
    envVars:
      - key: TOCA_API_URL
        value: https://sistema-vendas-api.onrender.com

databases:
  - name: sistema-vendas-db
    plan: free
